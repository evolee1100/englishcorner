<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>English Corner 英文角</title>
  <meta name="description" content="中翻英打字、聽寫練習，Level 1–5 情境主題，邊打邊學邊開口。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=1.3.1" />
  <script>
    // 載入前先套用手動選的深淺色，避免閃一下
    try { const t = JSON.parse(localStorage.getItem("ec_prefs_v1") || "{}").theme; if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="回首頁">
      <span class="brand-logo">EC</span>
      <span class="brand-text">English <b>Corner</b></span>
    </a>
    <div class="topbar-actions">
      <button class="chip" id="btn-theme" type="button" title="切換深色／淺色">🌙</button>
      <button class="chip" id="btn-script" type="button" title="繁簡切換">繁</button>
      <button class="chip chip-account" id="btn-account" type="button">登入同步</button>
    </div>
  </header>

  <main id="app"></main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" data-close aria-label="關閉">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/t2cn.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script src="js/config.js?v=1.3.1" defer></script>
  <script src="js/data.js?v=1.3.1" defer></script>
  <script src="js/store.js?v=1.3.1" defer></script>
  <script src="js/app.js?v=1.3.1" defer></script>
</body>
</html>
